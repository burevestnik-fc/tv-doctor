name: Сборка APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Получить код
        uses: actions/checkout@v4

      - name: Установить Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Установить Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3

      - name: Собрать APK
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon 2>&1 | tee build.log

      - name: Показать ошибки сборки
        if: failure()
        run: |
          grep -E "^e: |What went wrong|Could not (find|resolve)|> |error:|Unresolved|FAILED" build.log | head -n 80 > errors.txt || true
          split -l 8 errors.txt part_
          for f in part_*; do
            echo "::error::$(sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g' "$f")"
          done

      - name: Переименовать APK
        run: cp app/build/outputs/apk/debug/app-debug.apk "TV-Doctor-${{ github.run_number }}.apk"

      - name: Сохранить APK как артефакт
        uses: actions/upload-artifact@v4
        with:
          name: TV-Doctor-${{ github.run_number }}
          path: TV-Doctor-${{ github.run_number }}.apk

      - name: Опубликовать в Releases (удобно скачивать с телефона)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: ТВ-Доктор, сборка ${{ github.run_number }}
          body: Скачайте APK ниже и установите на телефон.
          files: TV-Doctor-${{ github.run_number }}.apk
          make_latest: true
